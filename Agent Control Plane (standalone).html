  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 <a href=\"docs/Cognous_Agent_Control_Plane_Whitepaper_070526.pdf\" target=\"_blank\" rel=\"noopener\" class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; text-decoration: none;\">\n              <div class=\"t-label\" style=\"margin-bottom: 10px;\">For architects, engineers &amp; developers<\u002Fdiv>\n              <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Technical whitepaper<\u002Fh3>\n              <p class=\"t-sm\" style=\"flex-grow: 1; margin-bottom: 14px;\">The full specification, schema, and reference design.<\u002Fp>\n              <span class=\"nav-link\" style=\"color: #22d3ee; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;\">Read PDF →<\u002Fspan>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 12-step flow diagram -->\n      <div class=\"hero-diagram\" style=\"display: flex; justify-content: center; align-items: center;\">\n        <div style=\"display: flex; flex-direction: column; align-items: stretch; width: 100%; max-width: 300px;\" role=\"img\" aria-label=\"Control-plane run trace\">\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #64748b;\">Agent task<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Policy configuration<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Frame<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Action proposal<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Policy gate<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Policy decision + evaluation trace<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 10px;\">\n            <div style=\"display: flex; gap: 5px;\">\n              <div style=\"flex: 1; background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 3px; padding: 5px 4px; text-align: center;\">\n                <span style=\"font-size: 12px; color: #94a3b8;\">Allow<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex: 1; background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 3px; padding: 5px 4px; text-align: center;\">\n                <span style=\"font-size: 12px; color: #94a3b8;\">Block<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex: 1; background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 3px; padding: 5px 4px; text-align: center;\">\n                <span style=\"font-size: 12px; color: #94a3b8;\">Escalate<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Tool adapter execution<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Run record<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Validation report<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Replay bundle<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: center; padding: 2px 0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(34,211,238,0.35)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n\n          <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 4px; padding: 7px 14px; text-align: center;\">\n            <span style=\"font-size: 12px; color: #94a3b8;\">Redacted or signed export<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"text-align: center; padding-top: 10px;\">\n            <span style=\"font-size: 12px; color: #64748b; letter-spacing: 0.06em; text-transform: uppercase;\">Control-plane run trace<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── PROBLEM ─────────────────────────────────────────────────── -->\n<section id=\"problem\" style=\"padding: 72px 0; background: #1e293b;\">\n  <div class=\"section-wrap\">\n    <div class=\"t-eyebrow\" style=\"margin-bottom: 12px;\">The problem<\u002Fdiv>\n    <h2 class=\"t-h2\" style=\"margin-bottom: 12px; max-width: 560px;\">AI agents are moving faster than enterprise controls.<\u002Fh2>\n    <p class=\"t-body\" style=\"margin-bottom: 36px; max-width: 700px;\">As agents begin using tools, accessing data, triggering workflows, and making decisions across enterprise systems, organizations need more than policies and dashboards. They need a runtime record of what the agent proposed, what policy decided, why the decision was reached, what was blocked, what authority existed, what sources were relied on, and how the run can be reconstructed later.<\u002Fp>\n    <div class=\"grid-3\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;\">\n\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-meta\" style=\"margin-bottom: 8px;\">01<\u002Fdiv>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Unrecorded agent actions<\u002Fh3>\n        <p class=\"t-sm\">Agents may propose or take actions without a structured pre-action record. Teams cannot distinguish what was proposed from what was executed.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-meta\" style=\"margin-bottom: 8px;\">02<\u002Fdiv>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Unauthorized tool use<\u002Fh3>\n        <p class=\"t-sm\">Without a policy gate, agents may invoke tools or access systems beyond their intended authority scope.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-meta\" style=\"margin-bottom: 8px;\">03<\u002Fdiv>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Missing blocked-action records<\u002Fh3>\n        <p class=\"t-sm\">When a proposed action is denied, the denial often disappears silently. There is no durable record of what was blocked or why.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-meta\" style=\"margin-bottom: 8px;\">04<\u002Fdiv>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Opaque policy decisions<\u002Fh3>\n        <p class=\"t-sm\">Allow, block, and escalate outcomes are difficult to review when there is no trace showing which policy rule matched.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-meta\" style=\"margin-bottom: 8px;\">05<\u002Fdiv>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Ambiguous source reliance<\u002Fh3>\n        <p class=\"t-sm\">Agents act on data from tools, APIs, files, databases, user input, and model output. Without reliance records, provenance is unclear.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-meta\" style=\"margin-bottom: 8px;\">06<\u002Fdiv>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Runs that cannot be replayed<\u002Fh3>\n        <p class=\"t-sm\">After an incident, teams need a structured record to reconstruct what the agent proposed, what was decided, what was relied on, and what was exported.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── PRODUCT ─────────────────────────────────────────────────── -->\n<section id=\"product\" style=\"padding: 72px 0; background: #0f172a;\">\n  <div class=\"section-wrap\">\n    <div class=\"t-eyebrow\" style=\"margin-bottom: 12px;\">What it does<\u002Fdiv>\n    <h2 class=\"t-h2\" style=\"margin-bottom: 12px; max-width: 640px;\">A minimal runtime governance layer for agentic workflows.<\u002Fh2>\n    <p class=\"t-body\" style=\"margin-bottom: 4px; max-width: 680px;\">Cognous Agent Control Plane is not an agent framework and not a model runtime. It sits beside an agent and records the governance trail around the agent's proposed actions.<\u002Fp>\n    <p class=\"t-body\" style=\"margin-bottom: 36px; max-width: 680px;\">It provides deterministic policy gating, policy evaluation traces, structured run records, blocked-action records, authority context, reliance records, semantic validation reports, redacted exports, signed replay bundles, filesystem persistence, and replay bundles.<\u002Fp>\n\n    <!-- Row 1: A–E -->\n    <div class=\"grid-5\" style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 12px;\">\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">A — Policy gate<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Deterministic policy gate<\u002Fh3>\n        <p class=\"t-sm\">Evaluates proposed agent actions against allowed tools, blocked tools, action type, and active authority scope. Identical inputs produce the same result and deterministic fingerprint.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">B — Evaluation traces<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Policy evaluation traces<\u002Fh3>\n        <p class=\"t-sm\">Records the ordered policy-rule path behind each decision, including which rule matched and why the final result was allow, block, or escalate.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">C — Blocked actions<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Blocked-action records<\u002Fh3>\n        <p class=\"t-sm\">Creates a structured record when an agent action is denied, rather than letting blocked operations disappear from the audit trail.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">D — Authority<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Authority records<\u002Fh3>\n        <p class=\"t-sm\">Captures who or what authorized an action, under what scope, and whether the authorization is time-bound.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">E — Reliance<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Reliance records<\u002Fh3>\n        <p class=\"t-sm\">Records which tool, file, database, API, user input, or model output the agent relied on, preserving provenance across the run.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Row 2: F–J -->\n    <div class=\"grid-5\" style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;\">\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">F — Validation<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Semantic validation reports<\u002Fh3>\n        <p class=\"t-sm\">Checks internal consistency across run records and replay bundles, including run identifiers, action references, blocked-action links, trace relationships, and missing-output warnings.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">G — Redaction<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Redacted exports<\u002Fh3>\n        <p class=\"t-sm\">Creates privacy-safer copies of run records and replay bundles by redacting payloads, targets, final output, and recorded reasons while preserving structure and fingerprints.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">H — Signing<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Signed replay bundles<\u002Fh3>\n        <p class=\"t-sm\">Adds optional HMAC-SHA256 export integrity metadata so replay bundles can be checked for modification after export.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">I — Tool adapters<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Controlled tool execution<\u002Fh3>\n        <p class=\"t-sm\">Provides a minimal adapter pattern that executes a tool only after the control plane records the action proposal and the policy gate returns allow.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 16px;\">\n        <span class=\"t-label\" style=\"display: block; margin-bottom: 10px;\">J — Replay<\u002Fspan>\n        <h3 class=\"t-h3\" style=\"margin-bottom: 6px;\">Replay bundles<\u002Fh3>\n        <p class=\"t-sm\">Exports a reconstructable run record containing the frame, proposed actions, policy decisions, evaluation traces, authority records, reliance records, blocked actions, and final output.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── ARCHITECTURE ────────────────────────────────────────────── -->\n<section id=\"architecture\" style=\"padding: 72px 0; background: #1e293b;\">\n  <div class=\"section-wrap\">\n    <div class=\"t-eyebrow\" style=\"margin-bottom: 12px;\">Architecture<\u002Fdiv>\n    <h2 class=\"t-h2\" style=\"margin-bottom: 12px;\">Simple by design.<\u002Fh2>\n    <p class=\"t-body\" style=\"margin-bottom: 36px; max-width: 580px;\">The implementation is intentionally minimal. It demonstrates the control-plane pattern without trying to become a full enterprise governance platform.<\u002Fp>\n\n    <div class=\"arch-grid\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;\">\n\n      <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 5px; padding: 20px;\">\n        <span style=\"font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 14px;\">Agent<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <span style=\"font-size: 13px; color: #94a3b8;\">Submits action proposals<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Receives allow, block, or escalate decisions<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Executes only when allowed<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Can use existing orchestration code<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 5px; padding: 20px;\">\n        <span style=\"font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 14px;\">Control plane<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <span style=\"font-size: 13px; color: #94a3b8;\">Frames the task<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Applies lightweight policy configuration<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Checks policy and authority<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Records policy decisions and traces<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Records blocked actions<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Records reliance<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Produces run records<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #24334a; border: 1px solid rgba(34,211,238,0.12); border-radius: 5px; padding: 20px;\">\n        <span style=\"font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 14px;\">Replay and export layer<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <span style=\"font-size: 13px; color: #94a3b8;\">Generates replay bundles<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Produces semantic validation reports<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Creates redacted exports<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Signs replay bundles<\u002Fspan>\n          <span style=\"font-size: 13px; color: #94a3b8;\">Persists records through a filesystem adapter<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <p class=\"t-meta\" style=\"margin-top: 16px; max-width: 680px;\">The public implementation uses JSON-schema-governed records and Pydantic models. It is designed for inspection, adaptation, and extension.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── OPEN SOURCE ─────────────────────────────────────────────── -->\n<section id=\"opensource\" style=\"padding: 72px 0; background: #0f172a;\">\n  <div class=\"section-wrap\">\n    <div style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.16); border-radius: 8px; padding: 40px; display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; flex-wrap: wrap;\">\n      <div style=\"max-width: 520px;\">\n        <div class=\"t-eyebrow\" style=\"margin-bottom: 12px;\">Open source<\u002Fdiv>\n        <h2 class=\"t-h2\" style=\"margin-bottom: 12px;\">Open-source reference implementation.<\u002Fh2>\n        <p class=\"t-body\" style=\"margin-bottom: 20px;\">The repository is public so teams can inspect the pattern, run the examples, adapt the schemas, test deterministic policy gating, validate exported records, redact sensitive fields, sign replay bundles, and experiment with controlled tool execution in their own agent workflows.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; padding-top: 16px; border-top: 1px solid rgba(34,211,238,0.08);\">\n          <div style=\"display: flex; gap: 8px; align-items: center; padding: 3px 0;\">\n            <span style=\"width: 3px; height: 3px; border-radius: 50%; background: rgba(34,211,238,0.4); flex-shrink: 0;\"><\u002Fspan>\n            <span class=\"t-sm\">Python package<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; align-items: center; padding: 3px 0;\">\n            <span style=\"width: 3px; height: 3px; border-radius: 50%; background: rgba(34,211,238,0.4); flex-shrink: 0;\"><\u002Fspan>\n            <span class=\"t-sm\">Pydantic object model<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; align-items: center; padding: 3px 0;\">\n            <span style=\"width: 3px; height: 3px; border-radius: 50%; background: rgba(34,211,238,0.4); flex-shrink: 0;\"><\u002Fspan>\n            <span class=\"t-sm\">JSON schemas<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; align-items: center; padding: 3px 0;\">\n            <span style=\"width: 3px; height: 3px; border-radius: 50%; background: rgba(34,211,238,0.4); flex-shrink: 0;\"><\u002Fspan>\n            <span class=\"t-sm\">CLI<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; align-items: center; padding: 3px 0;\">\n            <span style=\"width: 3px; height: 3px; border-radius: 50%; background: rgba(34,211,238,0.4); flex-shrink: 0;\"><\u002Fspan>\n            <span class=\"t-sm\">Test suite<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; align-items: center; padding: 3px 0;\">\n            <span style=\"width: 3px; height: 3px; border-radius: 50%; background: rgba(34,211,238,0.4); flex-shrink: 0;\"><\u002Fspan>\n            <span class=\"t-sm\">GitHub Actions workflow<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; align-items: center; padding: 3px 0;\">\n            <span style=\"width: 3px; height: 3px; border-radius: 50%; background: rgba(34,211,238,0.4); flex-shrink: 0;\"><\u002Fspan>\n            <span class=\"t-sm\">Examples<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; align-items: center; padding: 3px 0;\">\n            <span style=\"width: 3px; height: 3px; border-radius: 50%; background: rgba(34,211,238,0.4); flex-shrink: 0;\"><\u002Fspan>\n            <span class=\"t-sm\">Apache-2.0 license<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex-shrink: 0; align-self: flex-end; display: flex; flex-direction: column; align-items: flex-start; gap: 10px;\">\n        <a href=\"https://github.com/cogno-us/cognous-agent-control-plane\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"background: #0FBF3E; color: #ffffff;\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.92.359.31.678.921.678 1.856 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z\"><\u002Fpath><\u002Fsvg>\n          View the repository\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── WHO IT IS FOR ───────────────────────────────────────────── -->\n<section id=\"audience\" style=\"padding: 72px 0; background: #1e293b;\">\n  <div class=\"section-wrap\">\n    <div class=\"t-eyebrow\" style=\"margin-bottom: 12px;\">Who it is for<\u002Fdiv>\n    <h2 class=\"t-h2\" style=\"margin-bottom: 32px; max-width: 640px;\">Built for teams moving from agent demos to governed deployment.<\u002Fh2>\n\n    <!-- 5 equal columns -->\n    <div class=\"grid-5\" style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;\">\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-label\" style=\"margin-bottom: 8px;\">CIOs and CTOs<\u002Fdiv>\n        <p class=\"t-sm\">Need visibility into what AI agents are doing before they touch critical systems. Require structured records of proposed actions, authorized actions, blocked operations, and replayable runs.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-label\" style=\"margin-bottom: 8px;\">CISOs and risk leaders<\u002Fdiv>\n        <p class=\"t-sm\">Need blocked-action records, runtime authorization, validation reports, redacted exports, signed replay bundles, and replayable incident trails.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-label\" style=\"margin-bottom: 8px;\">AI platform teams<\u002Fdiv>\n        <p class=\"t-sm\">Need a lightweight control layer that sits beside existing agent frameworks without replacing them. Require a reference implementation they can adapt and extend.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-label\" style=\"margin-bottom: 8px;\">Governance and compliance teams<\u002Fdiv>\n        <p class=\"t-sm\">Need evidence of what happened, what was allowed, what was blocked, what rule path was followed, what the agent relied on, and how the run can be reconstructed.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card-hover\" style=\"background: #0f172a; border: 1px solid rgba(34,211,238,0.12); border-radius: 8px; padding: 20px;\">\n        <div class=\"t-label\" style=\"margin-bottom: 8px;\">Developers building agent workflows<\u002Fdiv>\n        <p class=\"t-sm\">Need a small package that can be added beside existing agent code to record action proposals, gate tool execution, and export replayable run records.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── SCOPE ───────────────────────────────────────────────────── -->\n<section id=\"scope\" style=\"padding: 72px 0; background: #0f172a;\">\n  <div class=\"section-wrap\">\n    <div class=\"scope-grid\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start;\">\n\n      <div>\n        <div class=\"t-eyebrow\" style=\"margin-bottom: 12px;\">Scope<\u002Fdiv>\n        <h2 class=\"t-h2\" style=\"margin-bottom: 12px;\">Intentionally narrow.<\u002Fh2>\n        <p class=\"t-body\" style=\"margin-bottom: 20px;\">This MVP is deliberately scoped. It is not:<\u002Fp>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(34,211,238,0.08);\">\n            <span class=\"t-sm\" style=\"color: rgba(192,57,43,0.60); flex-shrink: 0;\">×<\u002Fspan>\n            <span class=\"t-sm\">A complete enterprise AI governance platform<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(34,211,238,0.08);\">\n            <span class=\"t-sm\" style=\"color: rgba(192,57,43,0.60); flex-shrink: 0;\">×<\u002Fspan>\n            <span class=\"t-sm\">An agent framework<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(34,211,238,0.08);\">\n            <span class=\"t-sm\" style=\"color: rgba(192,57,43,0.60); flex-shrink: 0;\">×<\u002Fspan>\n            <span class=\"t-sm\">A model runtime<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(34,211,238,0.08);\">\n            <span class=\"t-sm\" style=\"color: rgba(192,57,43,0.60); flex-shrink: 0;\">×<\u002Fspan>\n            <span class=\"t-sm\">A hosted dashboard<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(34,211,238,0.08);\">\n            <span class=\"t-sm\" style=\"color: rgba(192,57,43,0.60); flex-shrink: 0;\">×<\u002Fspan>\n            <span class=\"t-sm\">A production key-management system<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(34,211,238,0.08);\">\n            <span class=\"t-sm\" style=\"color: rgba(192,57,43,0.60); flex-shrink: 0;\">×<\u002Fspan>\n            <span class=\"t-sm\">A substitute for good policy design<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(34,211,238,0.08);\">\n            <span class=\"t-sm\" style=\"color: rgba(192,57,43,0.60); flex-shrink: 0;\">×<\u002Fspan>\n            <span class=\"t-sm\">A guarantee that model outputs are correct<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(34,211,238,0.08);\">\n            <span class=\"t-sm\" style=\"color: rgba(192,57,43,0.60); flex-shrink: 0;\">×<\u002Fspan>\n            <span class=\"t-sm\">A full compliance automation system<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 12px; padding: 9px 0;\">\n            <span class=\"t-sm\" style=\"color: rgba(192,57,43,0.60); flex-shrink: 0;\">×<\u002Fspan>\n            <span class=\"t-sm\">A complete security boundary by itself<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding-top: 44px;\">\n        <div style=\"background: #1e293b; border: 1px solid rgba(34,211,238,0.20); border-radius: 8px; padding: 28px; box-shadow: 0 0 24px rgba(34,211,238,0.05);\">\n          <div class=\"t-eyebrow\" style=\"margin-bottom: 14px;\">What it is<\u002Fdiv>\n          <p class=\"t-body\">A public reference implementation for deterministic policy gating, policy evaluation traces, semantic validation reports, redacted exports, signed replay bundles, controlled tool-adapter execution, and replayable agent-run records.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── CLOSING CTA ─────────────────────────────────────────────── -->\n<section style=\"padding: 80px 0; background: #1e293b; border-top: 1px solid rgba(34,211,238,0.10);\">\n  <div class=\"section-wrap\" style=\"text-align: center;\">\n    <div class=\"t-eyebrow\" style=\"margin-bottom: 16px;\">Get started<\u002Fdiv>\n    <h2 class=\"t-h2\" style=\"margin-bottom: 12px; max-width: 520px; margin-left: auto; margin-right: auto;\">Start with replayable agent control.<\u002Fh2>\n    <p class=\"t-body\" style=\"margin-bottom: 28px; max-width: 520px; margin-left: auto; margin-right: auto;\">Before enterprises delegate work to AI agents, they need a record of what agents proposed, what policy decided, what was blocked, what authority existed, what sources were relied on, and how to replay the run later.<\u002Fp>\n    <div style=\"display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap;\">\n      <a href=\"https://github.com/cogno-us/cognous-agent-control-plane\" target=\"_blank\" rel=\"noopener\" class=\"btn-primary\" style=\"background: #0FBF3E; color: #ffffff;\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2
